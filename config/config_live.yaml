# LIVE DEMO config — active paper trading on real 5-minute CEX data so you can
# watch trades happen in real time (like MockApe). SIMULATED money only.
#
# HONEST NOTE: "active" means it trades often, NOT that it is profitable. Over a
# few hours on memecoins the result is as likely red as green — costs and noise
# dominate short horizons. This is a live *demo of activity*, not a profit engine.
# Risk limits are unchanged and mandatory.

mode: paper

data:
  require_real: true
  source: ccxt                 # real OHLCV, reliable & frequent (5m bars)
  exchange: binance
  quote: USDT
  timeframe: 5m                # short bars -> visible trades within the hour
  lookback_days: 5
  cache_dir: .cache
  cache_ttl_min: 2             # refresh often so new 5m bars arrive live
  max_retries: 4
  backoff_base_sec: 1.5
  universe:
    - DOGE/USDT
    - SHIB/USDT
    - PEPE/USDT
    - WIF/USDT
    - BONK/USDT
    - FLOKI/USDT
  auto_discovery:
    enabled: false

engine:
  initial_equity: 200.0        # a real 200-unit virtual bankroll on real memecoins
  fee_rate: 0.001              # realistic taker fee (per side)
  slippage_rate: 0.0015        # realistic slippage (per side)
  risk_per_trade: 0.01         # 1% — never loosened
  leverage_cap: 1.0
  min_stop_frac: 0.004         # reject stops tighter than 0.4% of price
  take_profit_r: 1.5           # tighter TP -> more closed trades to watch
  allow_short: false
  cost_multiplier: 1.0         # REALISTIC (not the pessimistic x2) for the live demo

risk:
  max_open_positions: 6
  daily_loss_limit: 0.03       # circuit breaker (safe hold)
  max_drawdown_kill: 0.25

validation:
  walkforward: {train_frac: 0.6, test_frac: 0.4, folds: 4}
  montecarlo: {runs: 500, ruin_drawdown: 0.5}
  min_trades: 20
  regime: {adx_period: 14, adx_trend_min: 20, vol_window: 20}

score:
  weights: {edge: 0.35, robustness: 0.25, regime: 0.20, recency: 0.20}
  green_min: 65
  yellow_min: 45

optimize: {wf_efficiency_min: 0.5, min_trades: 20}
portfolio: {max_correlation: 0.7, quality_min_score: 50, method: inverse_vol}
memecoin_filters: {min_liquidity_usd: 50000, min_age_days: 30, min_volume_usd: 100000}

# Trade-active set (trend + momentum + one mean-reversion) x 6 symbols = many combos.
active:
  strategies: [ema_crossover, supertrend, donchian_breakout, macd_momentum, roc_momentum, rsi_mean_reversion]

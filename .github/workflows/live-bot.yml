name: live-bot

# Aktiver Live-Paper-Bot in der Cloud: fuehrt regelmaessig EINEN Paper-Tick auf
# echten 5-Minuten-CEX-Daten aus und committet cloud/live.db + LIVE_STATUS_REPORT.md
# zurueck. So zeigt das Streamlit-Dashboard (Sidebar: "Live paper") das Profit-Verdikt.
# SIMULIERTES Geld. Live-Handel gesperrt. Aktivitaet ist KEIN Profit-Versprechen.

on:
  schedule:
    - cron: "*/15 * * * *"     # alle ~15 Minuten (GitHub-Cron ist best effort)
  workflow_dispatch: {}

concurrency:
  group: live-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    env:
      TRADING_DB: cloud/live.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten installieren
        run: pip install -r requirements-ci.txt
      - name: Live Paper-Tick (echte 5m-Daten, simuliertes Geld)
        run: |
          mkdir -p cloud
          python cli.py --config config/config_live.yaml ci-tick --report LIVE_STATUS_REPORT.md
      - name: Zustand + Report zurueck committen
        run: |
          git config user.name "memecoin-bot"
          git config user.email "memecoin-bot@users.noreply.github.com"
          git add -f cloud/live.db LIVE_STATUS_REPORT.md
          if git diff --cached --quiet; then
            echo "Keine Aenderung."
          else
            git commit -m "live-bot: tick $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
              if git push; then echo "pushed"; break; fi
              echo "push race, retry $i"; sleep 5
            done
          fi

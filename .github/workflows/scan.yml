name: memecoin-scan

# Haelt die Signal-Watchlist aktuell: scannt regelmaessig aktive On-Chain-Memecoins
# (Aufmerksamkeit + Rug-Filter via DexScreener/RugCheck) und committet watchlist.yaml
# zurueck. "Attention" ist KEINE Prognose. Kein echtes Geld, keine Order.

on:
  schedule:
    - cron: "17 * * * *"        # stuendlich (versetzt zum paper-tick)
  workflow_dispatch: {}

concurrency:
  group: memecoin-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten installieren
        run: pip install -r requirements-ci.txt
      - name: Scan (viele Coins: new/trending/top, multi-chain; best-effort)
        run: python cli.py scan --chains sol,bnb,eth --feeds trending,new,top --pages 1 --rugcheck --rugcheck-limit 15 --out watchlist.yaml || echo "scan degraded (network) - keeping previous watchlist"
      - name: Watchlist zurueck committen
        run: |
          git config user.name "memecoin-bot"
          git config user.email "memecoin-bot@users.noreply.github.com"
          git add -f watchlist.yaml
          if git diff --cached --quiet; then
            echo "Keine Aenderung."
          else
            git commit -m "memecoin-scan: watchlist $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git push
          fi
